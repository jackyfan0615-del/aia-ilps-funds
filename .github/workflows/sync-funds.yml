name: Sync AIA fund catalog

on:
  schedule:
    - cron: "15 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run sync-funds
      - name: Commit catalog snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/funds.json data/catalog-changes.json
          if git diff --cached --quiet; then
            echo "No catalog file changes"
            exit 0
          fi
          git commit -m "Sync AIA 卓達智悅 2 fund catalog"
          git push
