name: Quarterly portfolio review

on:
  schedule:
    - cron: "15 2 1 1,4,7,10 *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run snapshot-portfolios
      - name: Commit quarterly mix snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/portfolio-quarter.json
          if git diff --cached --quiet; then
            echo "No portfolio snapshot changes"
            exit 0
          fi
          git commit -m "Stamp AIA ILPS reference portfolios for the quarter"
          git push
